{% extends 'base.html' %}

{% block title %}
   Existing Users
{% endblock %}

{% block content %}
<h1>Users</h1>
<p>List of users</p>
<ul>
    {% for user in users %}
      <li><a href="/users/{{user.id}}">{{user.first_name}} {{user.last_name}}</a></li>
    {% endfor %}
<a href="/users/new" class="redirect-btn">Add New User</a>
{% endblock %}
