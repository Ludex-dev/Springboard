{% extends 'base.html' %}

{% block title %}
   Edit Profile
{% endblock %}

{% block content %}
<form method="POST">
   <label for="first_name">First Name:</label><input type="text" name="first_name" id="first_name" value="{{user.first_name}}">
   <label for="last_name">Last Name:</label><input type="text" name="last_name" id="last_name" value="{{user.last_name}}">
   <label for="profile_pic">Profile Picture:</label>
   <input type="text" name="profile_pic" id="profile_pic" value="{{user.profile_pic}}">
   <button type="submit">Submit</button>
</form>
{% endblock %}
